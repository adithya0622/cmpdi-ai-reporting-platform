services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: cmpdi
      POSTGRES_PASSWORD: cmpdi
      POSTGRES_DB: cmpdi
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cmpdi"]
      interval: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg2://cmpdi:cmpdi@db:5432/cmpdi
      DATA_DIR: /data
      LLM_BASE_URL: http://vllm:8001/v1
      LLM_API_KEY: EMPTY
      LLM_MODEL: Qwen/Qwen2.5-7B-Instruct
      EMBEDDING_MODEL: intfloat/multilingual-e5-base
      OCR_LANG: eng+hin
      API_TOKEN: ""
      AUTH_SECRET: change-me-in-production
      EXTRACTION_CONFIDENCE_THRESHOLD: 0.7
    volumes:
      - ./data:/data
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

  vllm:
    image: vllm/vllm-openai:v0.6.6
    profile: llm
    command: ["--model", "Qwen/Qwen2.5-7B-Instruct", "--max-model-len", "8192", "--port", "8001"]
    ports:
      - "8001:8001"
    volumes:
      - hf_cache:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  pgdata:
  hf_cache:
